name: benner-upstream-watch

# Opens an issue when upstream Zammad publishes a build the Benner image does not have yet, or
#   a newer release line. Scheduled runs use the default branch, which must be benner/7.2.
#   See .github/benner/README.md.

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: benner-upstream-watch

defaults:
  run:
    shell: bash

jobs:
  watch:
    if: github.repository == 'Benner-Metals/zammad'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: benner/7.2
          fetch-depth: 0

      - name: Compare with upstream
        id: state
        run: .github/benner/upstream-state.sh | tee -a "$GITHUB_OUTPUT"

      - name: Trial rebase
        id: trial
        if: steps.state.outputs.upstream_base != steps.state.outputs.upstream_tip
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/benner/rebase-onto-upstream.sh --trial | tee -a "$GITHUB_OUTPUT"

      - name: Alert
        # Alert even when the trial rebase failed; the issue reports that instead.
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_ASSIGNEE: ${{ vars.BENNER_ALERT_ASSIGNEE }}
          RELEASE_LINE: ${{ steps.state.outputs.release_line }}
          UPSTREAM_BRANCH: ${{ steps.state.outputs.upstream_branch }}
          UPSTREAM_BASE: ${{ steps.state.outputs.upstream_base }}
          UPSTREAM_BASE_BUILD: ${{ steps.state.outputs.upstream_base_build }}
          UPSTREAM_TIP: ${{ steps.state.outputs.upstream_tip }}
          UPSTREAM_TIP_BUILD: ${{ steps.state.outputs.upstream_tip_build }}
          STABLE_TIP_BUILD: ${{ steps.state.outputs.stable_tip_build }}
          TRIAL_OUTCOME: ${{ steps.trial.outcome }}
          TRIAL_RESULT: ${{ steps.trial.outputs.trial_result }}
          TRIAL_CONFLICTS: ${{ steps.trial.outputs.trial_conflicts }}
          TRIAL_DROPPED: ${{ steps.trial.outputs.trial_dropped }}
          TRIAL_DROPPED_SUBJECTS: ${{ steps.trial.outputs.trial_dropped_subjects }}
        run: .github/benner/alert.sh
